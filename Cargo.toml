# navgator — Cargo workspace.
#
# The engine dependency is quarantined in the `navgator-engine` crate (the only crate
# that touches the Servo fork). `navgator-protocol` holds servo-free wire types. The
# `navgator` crate is the browser binary. See docs/ARCHITECTURE.md, docs/FORK.md,
# ROADMAP §R2.
[workspace]
resolver = "3"
members = ["crates/navgator-protocol", "crates/navgator-engine", "crates/navgator"]

# Speed up the (enormous) engine dependency compile in dev builds.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"

# ── Engine fork patches (ROADMAP §R2/D1; see docs/FORK.md) ────────────────────
# Redirect Servo's stylo (CSS engine) and webrender (GPU renderer) deps to our
# maintained forks, so the whole engine surface is under github.com/airgap. The
# stylo fork now carries the `background-clip: text` keyword (LYK-1296) + light-dark()/dark system colors (LYK-1250)
# + fill/stroke and the other SVG paint properties for Servo (inline-SVG serialization copies them in);
# Cargo honours these workspace-root patches across the entire (swervo-transitive) graph.
[patch."https://github.com/servo/stylo"]
selectors            = { git = "https://github.com/airgap/stylo", rev = "cd2ec36a70548eaadd465cf8b84eed422024d410" }
servo_arc            = { git = "https://github.com/airgap/stylo", rev = "cd2ec36a70548eaadd465cf8b84eed422024d410" }
stylo                = { git = "https://github.com/airgap/stylo", rev = "cd2ec36a70548eaadd465cf8b84eed422024d410" }
stylo_atoms          = { git = "https://github.com/airgap/stylo", rev = "cd2ec36a70548eaadd465cf8b84eed422024d410" }
stylo_dom            = { git = "https://github.com/airgap/stylo", rev = "cd2ec36a70548eaadd465cf8b84eed422024d410" }
stylo_malloc_size_of = { git = "https://github.com/airgap/stylo", rev = "cd2ec36a70548eaadd465cf8b84eed422024d410" }
stylo_static_prefs   = { git = "https://github.com/airgap/stylo", rev = "cd2ec36a70548eaadd465cf8b84eed422024d410" }
stylo_traits         = { git = "https://github.com/airgap/stylo", rev = "cd2ec36a70548eaadd465cf8b84eed422024d410" }

# webrender is consumed from crates.io (0.69 / 0.2.2); redirect to our fork's 0.69 branch plus
# FreeType text stroking for -webkit-text-stroke (airgap/webrender nicole/text-stroke).
[patch.crates-io]
webrender         = { git = "https://github.com/airgap/webrender", rev = "363698bd1a7d641fdd88814c460cf280e659b383" }
webrender_api     = { git = "https://github.com/airgap/webrender", rev = "363698bd1a7d641fdd88814c460cf280e659b383" }
wr_malloc_size_of = { git = "https://github.com/airgap/webrender", rev = "363698bd1a7d641fdd88814c460cf280e659b383" }
# taffy (CSS Grid) from crates.io 0.11.0, redirected to our fork's fixes (airgap/taffy nicole/servo-fixes).
taffy             = { git = "https://github.com/airgap/taffy", rev = "67c4fdd3676944b399d326dc51cf2b38d3e8f3ef" }
