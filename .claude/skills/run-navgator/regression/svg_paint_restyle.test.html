<!doctype html><body style="margin:0;background:#202124">
<!-- Inline svg is painted from a cached serialization with its paint properties baked in.
     After the first paint this page changes them through the cascade only (an inherited
     colour, a class that sets fill); the icons must repaint, not keep their first colours. -->
<style>
  .row { display: flex; gap: 24px; padding: 40px; }
  .icon { fill: #888888; }
  .icon.on { fill: #44aaff; }
</style>
<div class="row">
  <span id="host" style="color:#ff4a4a"><svg width="80" height="80" viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="2" width="20" height="20"/></svg></span>
  <svg id="toggled" class="icon" width="80" height="80" viewBox="0 0 24 24"><path d="M2 2h20v20H2z"/></svg>
</div>
<script>
  setTimeout(() => {
    document.getElementById("host").style.color = "#44ff88";
    document.getElementById("toggled").classList.add("on");
  }, 2000);
</script>
</body>
