<!doctype html><meta charset=utf-8>
<!-- An image that finishes loading after first layout, inside an absolutely positioned grid
     child, must paint (the hoisted layout reused the box fragment from before the load). -->
<style>body{margin:20px;background:#fff}
.c{position:relative;height:120px;background:#eef}
.a{position:absolute;left:0;top:0;width:100%;height:100%}</style>
<div class=c style="display:grid;grid-template-columns:auto 1fr"><div class=a><img src="svg_ext.png?grid_abspos_img"></div></div>
