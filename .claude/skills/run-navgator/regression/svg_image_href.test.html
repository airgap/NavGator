<!doctype html><body style="margin:0;background:#313338">
<!-- External-href <image>: SVGImageElement fetches through the image cache and the
     serializer re-embeds the raster as a data: URI (LYK-136 stage 2). -->
<svg width="120" height="120" style="margin:40px"><mask id="m"><circle cx="60" cy="60" r="60" fill="white"/></mask><image href="svg_ext.png" width="120" height="120" mask="url(#m)"/></svg>
</body>
