<!doctype html><body style="margin:0;background:#313338">
<!-- Mask defined in a hidden document-level svg, referenced cross-svg (the Discord
     status-dot pattern). Requires serializer external-reference inlining (LYK-136). -->
<svg width="0" height="0" style="position:absolute"><defs>
  <mask id="gmask"><circle cx="60" cy="60" r="60" fill="white"/></mask>
</defs></svg>
<svg width="120" height="120" style="margin:40px"><rect width="120" height="120" fill="#23a559" mask="url(#gmask)"/></svg>
</body>
